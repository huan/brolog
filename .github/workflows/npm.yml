name: NPM

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js 26 for tests
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies from lockfile
        run: |
          node --version
          npm --version
          npm ci

      - name: Run lint and unit tests
        run: npm test

  pack:
    name: Pack
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js 26 for packaging
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run pack testing
        run: npm run test:pack

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
    name: Publish
    needs: [validate, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js 26 and npm registry
        uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Generate Version
        run: ./scripts/generate-version.sh

      - name: Build Dist
        run: npm run dist

      - name: Check Branch and Publish
        run: |
          if [[ ${{ github.ref }} =~ ^refs/heads/(main|v[0-9]+\.[0-9]+.*)$ ]]; then
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            if npx version-exists "$NAME" "$VERSION"
            then echo "$NAME@$VERSION exists on NPM, skipped."
            else npm publish
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
